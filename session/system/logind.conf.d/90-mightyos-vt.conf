# MightyOS kiosk (optional, never applied automatically): no spare text
# consoles. NAutoVTs=0: logind starts no getty on tty2..tty6 when someone
# switches there; ReserveVT=0: no always-on getty on tty6. The session's own
# tty1 is unaffected. Install into /etc/systemd/logind.conf.d/ and restart
# systemd-logind (or reboot; restarting logind ends running sessions).
[Login]
NAutoVTs=0
ReserveVT=0
