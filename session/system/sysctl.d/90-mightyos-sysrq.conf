# MightyOS kiosk (optional, never applied automatically): no Magic SysRq
# from the keyboard. Ubuntu's default 176 allows sync, remount read-only and
# reboot (Alt+SysRq+S/U/B), so anyone at the TV keyboard can reboot the box;
# 0 turns all of it off (echo b > /proc/sysrq-trigger as root still works).
# Install: sudo cp 90-mightyos-sysrq.conf /etc/sysctl.d/ && sudo sysctl --system
kernel.sysrq = 0
